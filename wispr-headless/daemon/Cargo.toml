[package]
name = "wispr-headless"
version = "0.1.0"
edition = "2021"
description = "Recorder and speech indicator that stand in for Wispr Flow's hidden windows"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
x11rb = { version = "0.13", features = ["shape", "randr"] }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3"
