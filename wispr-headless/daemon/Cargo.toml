[package]
name = "wispr-headless"
version = "0.1.0"
edition = "2021"
description = "Recorder and speech indicator that stand in for Wispr Flow's hidden windows"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dictation-api = { git = "https://github.com/sirati/dictation-api", rev = "c86db0fc9d68bae526b7b6d0c0857c0d85250ee6" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp"] }
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shape", "randr", "xkb", "xtest"] }
fontdue = "0.9"
# The dictation shortcut from /dev/input and typing through /dev/uinput.
evdev = "0.13"

[target.'cfg(unix)'.dependencies]
# inotify on /dev/input on Linux, for devices that appear later (the
# version evdev uses); signal to stop llama-server (asr/server.rs).
nix = { version = "0.29", default-features = false, features = ["inotify", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core", "objc2-core-foundation"] }
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
dispatch2 = "0.3"
objc2-audio-toolbox = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
# The dictation shortcut's event tap and typing.
objc2-core-graphics = "0.3"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3"
