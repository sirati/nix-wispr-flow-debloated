[package]
name = "wispr-ime"
version = "0.1.0"
edition = "2021"
description = "Safe-Rust IBus front for GNOME that hands input to fcitx5 and lets dictation commit text"
license = "MIT"
publish = false

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
